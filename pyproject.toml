[project]
name = "mre"
version = "0.1.0"
description = "ETL financeiro e risco de mercado com PostgreSQL e rastreabilidade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.5",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
]
[project.scripts]
finprov = "finprov.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finprov"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
# Raízes de importação: o pacote principal, o motor de cálculo e o painel.
src = ["src", "motor-calculo", "dash/motor-risco"]

[tool.pytest.ini_options]
# O motor de cálculo tem dependências próprias e roda em um job separado do CI.
testpaths = ["tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
