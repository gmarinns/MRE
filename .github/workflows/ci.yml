name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar dependências
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check src tests

      - name: Testes
        run: uv run pytest

  motor-calculo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o motor e as dependências de teste
        run: pip install -e "motor-calculo[dev]"

      - name: Testes do motor de cálculo
        run: pytest motor-calculo/tests
