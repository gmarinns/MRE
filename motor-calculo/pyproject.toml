[project]
name = "motor-calculo"
version = "0.3.0"
description = "Motor de risco de mercado do FinProv: VaR, ES, GARCH, carteira e backtesting."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.12",
    "arch>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motor_calculo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
